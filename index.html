        body:`<h2>从一棵树开始</h2><p>非空树有一个根结点。其他结点各有一个双亲，孩子可以有多个。结点的度是孩子数，度为 0 的结点是叶结点。根深度为 0，树高取从根到最深结点的边数。</p><ul><li>含 <code>n</code> 个结点的非空树有 <code>n−1</code> 条边，因为每个非根结点恰好接一条来自双亲的边。</li><li>二叉树的每个结点最多两个孩子，并区分左、右。只有一个孩子时，左右也会影响结构。</li><li>第 <code>k</code> 层至多有 <code>2^k</code> 个结点，高度为 <code>h</code> 时至多有 <code>2^(h+1)−1</code> 个结点。</li></ul><h2>辨认常见树形</h2><table class="mini-table"><thead><tr><th>类型</th><th>判断条件</th></tr></thead><tbody><tr><td>完全二叉树</td><td>除末层外各层排满，末层从左连续填充。</td></tr><tr><td>完美二叉树</td><td>每一层都达到最大结点数。</td></tr><tr><td>满二叉树</td><td>按本课课件定义，每个内部结点恰有两个孩子。</td></tr></tbody></table><div class="example"><strong>叶子数怎样求？</strong><p>按度数统计，边数同时等于 <code>n₁+2n₂</code> 和 <code>n₀+n₁+n₂−1</code>，所以 <code>n₀=n₂+1</code>。</p></div>`,

        body:`<h2>顺序存储</h2><p>以 0 为根下标，左孩子为 <code>2i+1</code>，右孩子为 <code>2i+2</code>。非根的双亲为 <code>⌊(i−1)/2⌋</code>。完全二叉树的下标紧凑，二叉堆也使用这个性质。</p><div class="example"><strong>带空位的例子</strong><p><code>[A, B, C, D, E, ∅, F]</code> 中 <code>C</code> 的左孩子下标是 5，对应空位；右孩子下标是 6，对应 <code>F</code>。</p></div><hr><h2>二叉链表</h2><p>每个结点保存数据及左右指针。空孩子用空指针表示，适合有许多空位的树。</p><pre><code>struct Node {

        body:`<h2>四种遍历</h2><table class="mini-table"><thead><tr><th>遍历</th><th>访问顺序</th><th>典型实现</th></tr></thead><tbody><tr><td>前序</td><td>根、左、右</td><td>递归或显式栈</td></tr><tr><td>中序</td><td>左、根、右</td><td>递归或显式栈</td></tr><tr><td>后序</td><td>左、右、根</td><td>递归或显式栈</td></tr><tr><td>层序</td><td>从上到下、同层从左到右</td><td>先进先出队列</td></tr></tbody></table><p>每个结点只输出一次，时间为 O(n)。深度优先递归的辅助空间随树高增长，层序队列的空间随最大层宽增长。</p><pre><code>void inorder(const Node* p) {

        body:`<h2>从数组识别堆</h2><p>最大堆中每个父结点都不小于任一孩子，最小堆反之。只需比较父子，兄弟之间没有大小约束。</p><ul><li><strong>插入。</strong>先放在数组尾部，再和双亲比较，违反堆序时交换并继续向上。</li><li><strong>删除堆顶。</strong>末元素补根，和两个孩子中更符合堆序的那个比较。必要时交换并继续下滤。</li><li><strong>建堆。</strong>从最后一个非叶结点开始向前逐个下滤。对于 n≥2，起始下标是 <code>⌊n/2⌋−1</code>。</li></ul><div class="example"><strong>时间复杂度</strong><p>插入和删除堆顶每次至多走过一条根到叶的路径，都是 O(log n)。自底向上建堆为 O(n)，因为大多数结点离底部很近。</p></div>`,

        body:`<h2>构造与编码</h2><ul><li>把每个符号的频数写在其叶结点上，形成候选森林。</li><li>反复取权重最小的两棵树。合并后的新根权重为两者之和，新树放回候选集合。</li><li>左边记 0，右边记 1。读根到叶的路径得到码字。解码每到一个叶子就输出符号并回根。</li></ul><p>符号全部位于叶子，保证任一码字不会成为另一码字的前缀。使用最小堆维护 k 棵候选树，构造复杂度为 O(k log k)。</p><hr><h2>计算有效码流位数</h2><p><code>WPL = Σ(频数 × 码长)</code>，也等于各轮合并权重之和。</p><div class="example"><strong>2022 A 卷的频数</strong><p><code>1:28, 2:10, 7:11, 8:7, 9:4</code>。四次合并权重为 11、21、32、60，WPL 为 124。60 个 4 字节整数编码前需 1920 bit，编码后有效码流为 124 bit。</p></div>`,

        body:`<h2>左孩子、右兄弟</h2><p>每个结点的左指针指向原树的第一个孩子，右指针指向原树的下一个兄弟。森林中各树的根也按顺序用右指针相连。</p><ul><li><strong>正向。</strong>保留双亲到首孩子的边，其余孩子按原顺序串成右兄弟链。</li><li><strong>逆向。</strong>沿二叉树根的右链分开各棵树。对每个结点，沿其左指针进入首孩子，再沿孩子的右链收集同一双亲下的其余孩子。</li></ul><h2>遍历的对应</h2><p>森林先序等于对应二叉树的前序，森林中序等于对应二叉树的中序。森林中序会先走完第一棵树的孩子，再访问根，最后才走其余树。</p><div class="example"><strong>两棵树的例子</strong><p><code>A(B,C(D))</code> 与 <code>E(F)</code>。二叉表示有 <code>A.left=B</code>、<code>B.right=C</code>、<code>C.left=D</code>、<code>A.right=E</code>、<code>E.left=F</code>。先序为 <code>A B C D E F</code>，中序为 <code>B D C A F E</code>。</p></div>`,

function arrayGraph(values) {
    const nodes = values.flatMap((label,id)=>label===null?[]:[{id,label}]);
    const edges = nodes.flatMap(({id})=>id===0?[]:[{from:Math.floor((id-1)/2),to:id,slot:id%2?'left':'right'}]);
    return {nodes,edges};
}
function layout(graph, width) {
    const {nodes,edges} = graph;
    const parented = new Set(edges.map(e=>e.to));
    const outgoing = new Map();
    for (const edge of edges) {
        if (!outgoing.has(edge.from)) outgoing.set(edge.from,[]);
        outgoing.get(edge.from).push(edge);
    }
    const points = new Map();
    let maxDepth = 0;
    if (edges.some(e=>e.slot==='general')) {
        let cursor = 0;
        function place(id,depth) {
            const children = (outgoing.get(id)||[]).map(e=>place(e.to,depth+1));
            const x = children.length ? (children[0]+children.at(-1))/2 : cursor++;
            maxDepth = Math.max(maxDepth,depth);
            points.set(id,[x,depth]);
            return x;
        }
        for (const node of nodes) if (!parented.has(node.id)) { place(node.id,0); cursor++; }
    } else {
        let cursor = 0;
        function place(id,depth) {
            const children=outgoing.get(id)||[];
            const left=children.find(e=>e.slot==='left');
            const right=children.find(e=>e.slot==='right');
            if (left) place(left.to,depth+1);
            points.set(id,[cursor++,depth]);
            maxDepth=Math.max(maxDepth,depth);
            if (right) place(right.to,depth+1);
        }
        for (const node of nodes) if (!parented.has(node.id)) { place(node.id,0); cursor++; }
    }
    const xs=[...points.values()].map(p=>p[0]);
    const min=Math.min(...xs), max=Math.max(...xs);
    const yStep=maxDepth>4?42:57;
    const margin=Math.min(63, width/7);
    for (const [id,[x,depth]] of points) {
        points.set(id,[min===max ? width/2 : margin+(x-min)/(max-min)*(width-margin*2),32+depth*yStep]);
    }
    return {points,height:Math.max(125,70+maxDepth*yStep)};
}
function drawTree(graph,state={},width=550) {
    const {nodes,edges}=graph, {active=[],visited=[],now,shownEdges}=state;
    if (!nodes.length) return `<svg class="plot" viewBox="0 0 ${width} 126" role="img" aria-label="空树"><text class="plot-label" x="${width/2}" y="65">空树</text></svg>`;
    const {points,height}=layout(graph,width);
    const arc=edges.map(e=>{
        const [x1,y1]=points.get(e.from),[x2,y2]=points.get(e.to);
        const key=`${e.from}:${e.to}`;
        const style = shownEdges && !shownEdges.includes(key) ? 'removed' : active.includes(e.to)?'live':'';
        return `<line class="edge ${style}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>${e.label && style!=='removed'?`<text class="edge-label" x="${(x1+x2)/2}" y="${(y1+y2)/2}">${esc(e.label)}</text>`:''}`;
    }).join('');
    return `<svg class="plot" viewBox="0 0 ${width} ${height}" role="img" aria-label="当前树结构">${arc}${nodes.map(({id,label})=>{
        const [x,y]=points.get(id), count=[...String(label)].length;
        const style=[visited.includes(id)?'visited':'',active.includes(id)?'active':'',now===id?'visit-now':''].join(' ');
        const radius = width<400 ? 15 : nodes.length>11 ? 14 : 18;
        const boxWidth=Math.max(radius*2,Math.min(count*9+10,90));
        const shape=count<=2?`<circle class="node-shape" cx="${x}" cy="${y}" r="${radius}"/>`:
            `<rect class="node-shape" x="${x-boxWidth/2}" y="${y-radius}" width="${boxWidth}" height="${radius*2}" rx="${radius}"/>`;
        return `<g class="${style}">${shape}<text class="node-text" x="${x}" y="${y}">${esc(label)}</text></g>`;
    }).join('')}</svg>`;
}

const toItems = input => input.trim().split(/[,\s，]+/u).filter(Boolean);
const needs = (condition,message) => { if (!condition) throw new Error(message); };
const fmt = values => values.length ? values.join(' · ') : '空';
const orders = {pre:'前序',in:'中序',post:'后序',level:'层序'};
const traversalConfig = {
    title:'自定义二叉树', default:{nodes:sampleTree.map(x=>x??'#').join(', '),order:'in'},
    fields:[['nodes','层序数组'],['order','遍历方式',Object.entries(orders)]],
    help:'按数组下标输入，逗号分隔。空位填 #，例如 A, B, C, D, E, #, F。最多 31 个槽、15 个结点。',
    stage:'遍历过程'
};
function traversal(data) {
    const values=toItems(data.nodes).map(s=>s==='#'?null:s);
    needs(values.length>0&&values.length<=31,'请输入 1–31 个槽位。');
    const graph=arrayGraph(values);
    needs(graph.nodes.length<=15 && graph.nodes.every(n=>[...n.label].length<=4),'最多支持 15 个结点，每个结点名最多 4 个字符。');
    needs(graph.edges.every(e=>values[e.from]!==null),'非空结点不能挂在空双亲下，请保留正确的数组槽位。');
    const order=Object.hasOwn(orders,data.order)?data.order:'in';
    const code=order==='level'
        ? ['根结点入队','当队列非空','    队首出队并访问','    非空左孩子入队','    非空右孩子入队','返回遍历序列']
        : ['遍历(结点)','    若为空，直接返回',...(order==='pre'?['    访问根','    遍历左子树','    遍历右子树']:order==='in'?['    遍历左子树','    访问根','    遍历右子树']:['    遍历左子树','    遍历右子树','    访问根']),'    返回上一级'];
    const output=[], visited=[], frames=[], stack=[], queue=[];
    const names=list=>list.map(i=>values[i]);
    function mark(line,explanation,active=[],now) {
        frames.push({graph,line,explanation,active,now,visited:[...visited],output:[...output],detailTitle:order==='level'?'队列（队首在左）':'调用栈（栈顶在右）',items:names(order==='level'?queue:stack)});
    }
    const present=id=>values[id]!==null&&values[id]!==undefined;
    mark(null,`准备执行${orders[order]}遍历。先观察树的结构。`);
    function visit(id,line) {
        output.push(values[id]);
        visited.push(id);
        mark(line,`访问 ${values[id]}，将其写入遍历序列。`,[id],id);
    }
    if (order==='level' && present(0)) {
        queue.push(0); mark(0,`根结点 ${values[0]} 入队。`,[0]);
        while (queue.length) {
            const id=queue.shift();
            visit(id,2);
            for (const [i,side] of [[1,'左'],[2,'右']]) {
                const child=2*id+i;
                if (!present(child)) continue;
                queue.push(child);
                mark(2+i,`${values[child]} 是 ${values[id]} 的${side}孩子，加入队尾。`,[id,child]);
            }
        }
    } else if (order!=='level') {
        const visitLine={pre:2,in:3,post:4}[order];
        const leftLine=order==='pre'?3:2;
        const rightLine=order==='post'?3:4;
        function dfs(id) {
            if (!present(id)) {
                mark(1,'遇到空子树，直接返回。',stack.slice(-1));
                return;
            }
            stack.push(id);
            mark(0,`进入 ${values[id]} 的调用。这一步保留当前栈帧。`,[id]);
            if (order==='pre') visit(id,visitLine);
            mark(leftLine,`从 ${values[id]} 向左递归。`,[id]);
            dfs(id*2+1);
            if (order==='in') visit(id,visitLine);
            mark(rightLine,`从 ${values[id]} 向右递归。`,[id]);
            dfs(id*2+2);
            if (order==='post') visit(id,visitLine);
            stack.pop();
            mark(5,`处理完 ${values[id]}，弹出它的栈帧。`,stack.slice(-1));
        }
        dfs(0);
    }
    mark(5,`遍历完成，共访问 ${output.length} 个结点。`);
    return {code,frames,outputLabel:'访问序列'};
}

const rebuildConfig = {
    title:'输入遍历序列',default:{mode:'pre',order:'A B D E C F',inorder:'D B E A C F'},
    fields:[['mode','已知序列',[['pre','前序 + 中序'],['post','后序 + 中序']]],['order','前序或后序'],['inorder','中序']],
    help:'序列用空格或逗号分隔。两个序列应含相同的互异结点，最多 12 个。',
    presets:[['前序示例',{}],['后序示例',{mode:'post',order:'D E B F C A'}]],
    stage:'逐步重建'
};
function rebuild(data) {
    const seq=toItems(data.order), mid=toItems(data.inorder);
    needs(seq.length>0&&seq.length<=12&&seq.every(x=>[...x].length<=4),'请输入 1–12 个结点，每个结点名最多 4 个字符。');
    needs(seq.length===mid.length&&new Set(seq).size===seq.length&&new Set(mid).size===mid.length&&mid.every(x=>seq.includes(x)),'两个序列必须包含相同的互异结点。');
    const post=data.mode==='post', graph={nodes:[],edges:[]}, frames=[];
    const code=[`取${post?'后序末项':'前序首项'}为根`,'在中序定位根','按左右长度分配序列','递归建立左子树','递归建立右子树','返回已建好的树'];
    function mark(line,explanation,active=[],items=[]) {
        const copy={nodes:[...graph.nodes],edges:[...graph.edges]};
        frames.push({graph:copy,line,explanation,active,detailTitle:'当前中序区间',items,output:copy.nodes.map(n=>n.label)});
    }
    mark(null,'两个序列准备完毕。先确定整棵树的根。',[],mid);
    function add(part,range,parent,slot) {
        if (!part.length) return;
        const id=post?part.at(-1):part[0];
        const cut=range.indexOf(id);
        needs(cut>=0,'两个输入序列无法还原出同一棵二叉树，请检查顺序。');
        const left=range.slice(0,cut), right=range.slice(cut+1);
        const children=post?part.slice(0,-1):part.slice(1);
        graph.nodes.push({id,label:id});
        if(parent!==null) graph.edges.push({from:parent,to:id,slot});
        mark(0,`${post?'后序最后':'前序最先'}的 ${id} 是当前子树的根。`,[id],range);
        mark(1,`在中序区间找到 ${id}。它的位置是当前区间的第 ${cut+1} 项。`,[id],range);
        mark(2,`左区间：${fmt(left)}。右区间：${fmt(right)}。`,[id],range);
        if (left.length) mark(3,`继续建立 ${id} 的左子树。`,[id],left);
        add(children.slice(0,cut),left,id,'left');
        if (right.length) mark(4,`继续建立 ${id} 的右子树。`,[id],right);
        add(children.slice(cut),right,id,'right');
    }
    add(seq,mid,null,null);
    mark(5,`树已重建，根结点为 ${graph.nodes[0].label}。`,[],mid);
    return {code,frames,outputLabel:'已建立的结点'};
}

const heapConfig = {
    title:'设置堆实验', default:{nodes:'4, 10, 3, 5, 1, 8',type:'max',operation:'build',value:'12'},
    fields:[['nodes','原始数组'],['type','堆类型',[['max','最大堆'],['min','最小堆']]],['operation','操作',[['build','自底向上建堆'],['insert','在初始堆中插入'],['pop','删除初始堆的堆顶']]],['value','插入值（仅插入时使用）']],
    help:'建堆可输入任意整数数组。插入或删除时，原始数组须已满足所选堆序。最多 12 个整数。',
    presets:[['建堆示例',{}],['插入示例',{nodes:'10, 5, 8, 4, 1, 3',operation:'insert'}],['删除示例',{nodes:'10, 5, 8, 4, 1, 3',operation:'pop'}]],
    stage:'堆的树形与数组'
};
function heap(data) {
    const raw=toItems(data.nodes), a=raw.map(Number), min=data.type==='min';
    needs(raw.length>0&&raw.length<=12&&raw.every((s,i)=>/^[+-]?\d+$/.test(s)&&Math.abs(a[i])<=999),'请输入 1–12 个 −999 到 999 之间的整数。');
    const better=(x,y)=>min?x<y:x>y;
    const type=min?'最小堆':'最大堆';
    const action=data.operation;
    const frames=[];
    const code=['初始化数组','定位待调整结点','    比较父子，选出交换目标','    交换并继续调整','返回满足堆序的数组'];
    function mark(line,explanation,active=[]) {
        frames.push({graph:arrayGraph(a),line,explanation,active,array:[...a],output:[...a],detailTitle:'当前下标',items:active});
    }
    mark(null, `原始数组将按${type}规则调整。`);
    function down(root) {
        while (root*2+1<a.length) {
            const l=root*2+1, r=l+1, child=r<a.length&&better(a[r],a[l])?r:l;
            mark(2,`比较父结点 ${a[root]} 和候选孩子 ${a[child]}。`,[root,child]);
            if (!better(a[child],a[root])) break;
            [a[root],a[child]]=[a[child],a[root]];
            mark(3,`交换数组下标 ${root} 与 ${child}，继续检查下方。`,[root,child]);
            root=child;
        }
    }
    if (action==='build') {
        for (let i=Math.floor(a.length/2)-1;i>=0;i--) {
            mark(1,`从下标 ${i} 开始下滤。`,[i]);
            down(i);
        }
    } else {
        needs(a.every((v,i)=>i===0||!better(v,a[Math.floor((i-1)/2)])),`插入和删除须从一个有效${type}开始。可点选示例。`);
        if (action==='insert') {
            const value=Number(data.value);
            needs(/^[+-]?\d+$/.test(data.value.trim())&&Math.abs(value)<=999&&a.length<12,'请输入合法插入值，并为新结点留出位置。');
            a.push(value);
            let i=a.length-1;
            mark(1,`将 ${value} 写入数组末尾。`,[i]);
            while (i>0) {
                const par=Math.floor((i-1)/2);
                mark(2,`比较 ${a[i]} 与双亲 ${a[par]}。`,[i,par]);
                if (!better(a[i],a[par])) break;
                [a[i],a[par]]=[a[par],a[i]];
                mark(3,`交换下标 ${i} 和 ${par}，继续向上。`,[i,par]);
                i=par;
            }
        } else {
            const top=a[0],last=a.pop();
            if (a.length) a[0]=last;
            mark(1,a.length?`删除堆顶 ${top}，把末元素 ${last} 补到根。`:`删除唯一结点 ${top}，堆已空。`,a.length?[0]:[]);
            down(0);
        }
    }
    mark(4,`调整完成。${a.length?`当前堆顶为 ${a[0]}。`:'当前是空堆。'}`);
    return {code,frames,outputLabel:'堆数组'};
}

const huffmanConfig = {
    title:'设置符号与频数',default:{weights:'1:28, 2:10, 7:11, 8:7, 9:4'},
    fields:[['weights','符号:频数']],
    help:'用逗号或空格分隔，例如 A:5, B:3。允许 1–7 个互异符号，频数为 1–9999。',
    presets:[['2022 A 卷频数',{}],['等权频数',{weights:'A:2, B:2, C:2, D:2'}],['单符号',{weights:'A:6'}]],
    stage:'候选树与合并'
};
function huffman(data) {
    const tokens=toItems(data.weights), leaves=tokens.map(item=>{
        const pair=item.split(/[:：]/u), weight=Number(pair[1]);
        needs(pair.length===2&&[...pair[0]].length>=1&&[...pair[0]].length<=3&&/^\d+$/.test(pair[1])&&weight>=1&&weight<=9999,'使用“符号:频数”，符号最多 3 个字符，频数为 1–9999。');
        return {symbol:pair[0],weight};
    });
    needs(leaves.length>=1&&leaves.length<=7&&new Set(leaves.map(x=>x.symbol)).size===leaves.length,'请输入 1–7 个互异符号。');
    let nextId=0, total=0;
    const q=leaves.map(leaf=>({...leaf,id:nextId++}));
    const frames=[], graph={nodes:q.map(node=>({id:node.id,label:`${node.symbol}:${node.weight}`})),edges:[]};
    const code=['按权重准备所有叶子','取出候选中最轻的两棵树','将两棵树合成新根，权重相加','把新树加入候选集合','沿左 0、右 1 生成码字'];
    const sort=()=>q.sort((a,b)=>a.weight-b.weight||a.id-b.id);
    sort();
    function mark(line,explanation,active=[],output=[]) {
        frames.push({graph:{nodes:[...graph.nodes],edges:[...graph.edges]},line,explanation,active,output,detailTitle:'候选根权重（升序）',items:q.map(n=>n.weight),detail:`已合并的权重和：${total}`});
    }
    mark(0,'给每个符号建立一个叶结点，按权重排列候选树。');
    while(q.length>1) {
        const l=q.shift(),r=q.shift(),weight=l.weight+r.weight;
        mark(1,`取出最轻的两棵树，权重分别为 ${l.weight} 和 ${r.weight}。`,[l.id,r.id]);
        const root={id:nextId++,weight,l,r};
        total+=weight;
        graph.nodes.push({id:root.id,label:weight});
        graph.edges.push({from:root.id,to:l.id,slot:'left',label:'0'},{from:root.id,to:r.id,slot:'right',label:'1'});
        mark(2,`新根权重为 ${l.weight} + ${r.weight} = ${weight}，左边记 0，右边记 1。`,[root.id]);
        q.push(root); sort();
        mark(3,`将权重 ${weight} 的新树放回候选集合。`,[root.id]);
    }
    const codes=new Map();
    function visit(node,path) {
        if (!node.l) { codes.set(node.symbol,path||'0'); return; }
        visit(node.l,`${path}0`);
        visit(node.r,`${path}1`);
    }
    visit(q[0],'');
    const bits=leaves.reduce((sum,n)=>sum+n.weight*codes.get(n.symbol).length,0);
    mark(4,leaves.length===1?`单符号码字约定为 0，有效码流为 ${bits} bit，树的 WPL 为 0。`:`构造完成。WPL = ${total}，有效码流为 ${bits} bit。`,[],leaves.map(n=>`${n.symbol} → ${codes.get(n.symbol)}`));
    return {code,frames,outputLabel:'前缀编码'};
}

const forestConfig = {
    title:'设置转换方向',default:{direction:'encode',preset:'example'},
    fields:[['direction','转换方向',[['encode','森林转二叉树'],['decode','二叉树还原森林']]],['preset','示例',[['example','双树森林'],['wide','多兄弟与三棵树']]]],
    help:'左侧保留森林结构，右侧展示左孩子、右兄弟表示。',stage:'森林与二叉表示'
};
function forest(data) {
    const parent=(id,children=[])=>({id,children});
    const roots=data.preset==='wide'?[parent('A',[parent('B'),parent('C'),parent('D',[parent('E')])]),parent('F'),parent('G')]:[parent('A',[parent('B'),parent('C',[parent('D')])]),parent('E',[parent('F')])];
    const nodes=[], original=[], converted=[], operations=[], pre=[], inside=[];
    function collect(level,isRoot=false) {
        level.forEach((node,i)=>{
            const {id,children}=node;
            nodes.push({id,label:id}); pre.push(id);
            if (children.length) {
                children.forEach(({id:to})=>original.push({from:id,to,slot:'general'}));
                const to=children[0].id;
                converted.push({from:id,to,slot:'left',label:'左'});
                operations.push({line:1,from:id,to,text:`${id} 的首个孩子 ${to}`});
            }
            if (i+1<level.length) {
                const to=level[i+1].id;
                converted.push({from:id,to,slot:'right',label:'右'});
                operations.push({line:isRoot?3:2,from:id,to,text:`${id} 与 ${to} 是${isRoot?'相邻树根':'相邻兄弟'}`});
            }
            collect(children);
            inside.push(id);
        });
    }
    collect(roots,true);
    const reverse=data.direction==='decode';
    const code=reverse?['读入左孩子、右兄弟表示','沿左指针取得首个孩子','沿右链收集其他孩子','沿根的右链拆成多棵树','输出还原后的森林']:
        ['读入有序森林','用左指针连接首个孩子','用右指针连接相邻兄弟','用右指针串联各棵树根','输出二叉表示和遍历顺序'];
    const binary={nodes,edges:converted}, source={nodes,edges:original};
    const frames=[], shown=[];
    function mark(line,explanation,active=[],output=[]) {
        const shownEdges=reverse?original.filter(e=>shown.includes(e.to)).map(e=>`${e.from}:${e.to}`):[];
        const primary=reverse?{shownEdges,active}:{active};
        const secondary=reverse?{active}:{shownEdges:[...shown],active};
        frames.push({graph:source,forestGraph:binary,primary,secondary,line,explanation,active,output,detailTitle:'当前关联结点',items:active});
    }
    mark(0,reverse?'从右侧二叉表示出发，在左侧还原森林。':'从左侧森林出发，在右侧建立左孩子、右兄弟指针。');
    operations.forEach(op=>{
        if (reverse) shown.push(op.to);
        else shown.push(`${op.from}:${op.to}`);
        mark(op.line,`${op.text}。${code[op.line]}。`,[op.from,op.to]);
    });
    mark(4,'转换完成。对照森林与二叉表示的遍历结果。',[],[`先序 ${fmt(pre)}`,`中序 ${fmt(inside)}`]);
    return {code,frames,outputLabel:'遍历对照'};
}

    byId('sidebar').classList.toggle('open',open);
    document.querySelector('.mobile-cover').hidden=!open;
    document.querySelector('[data-action="menu"][aria-expanded]')?.setAttribute('aria-expanded',String(open));
}
function updateTheme() {
    const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=theme;
    write('theme',theme);
    const btn=document.querySelector('[data-action="theme"]');
    btn.innerHTML=icon(theme==='dark'?'sun':'moon');
    btn.setAttribute('aria-label',theme==='dark'?'切换浅色主题':'切换深色主题');
    btn.title=theme==='dark'?'浅色主题':'深色主题';
}
function toggleLearn(id) {
    const btn=document.querySelector('[data-action="learn"]');
    learned=learned.includes(id)?learned.filter(x=>x!==id):[...learned,id];
    const saved=write('learned',learned);
    const done=learned.includes(id);
    btn.className=done?'secondary':'primary';
    btn.innerHTML=`${icon('check')}${done?'已复习':'标记为已复习'}`;
    btn.setAttribute('aria-pressed',String(done));
    renderShell(route);
    if (!saved) document.querySelector('.rail-foot small').textContent='当前浏览器无法持久保存进度';
}
function searchResults(q) {
    const s=q.trim().toLocaleLowerCase();
    const entries=[
        ...topics.map(t=>({href:`#${t.id}`,title:t.title,desc:t.blurb,group:'知识库'})),
        ...demoInfo.map(d=>({href:demoHref(d.id),title:d.title,desc:d.desc,group:'算法可视化'}))
    ];
    return entries.filter(t=>`${t.title} ${t.desc} ${t.group}`.toLocaleLowerCase().includes(s));
}
function fillSearch() {
    const entries=searchResults(byId('search-input').value);
    byId('search-results').innerHTML=entries.length?entries.map(t=>`<a href="${t.href}"><strong>${t.title}</strong><small>${t.group} · ${t.desc}</small></a>`).join(''):'<p>没有找到匹配的知识点或算法。</p>';
}
function openSearch() {
    const dialog=byId('search-dialog');
    if(!dialog.open) dialog.showModal();
    byId('search-input').value='';
    fillSearch();
    byId('search-input').focus();
}

function renderFields(config,values) {
    return config.fields.map(([key,label,options])=>`<label>${label}${options?
        `<select name="${key}">${options.map(([v,t])=>`<option value="${v}"${selected(v,values[key])}>${esc(t)}</option>`).join('')}</select>`:
        `<input type="text" name="${key}" maxlength="220" value="${esc(values[key]||'')}" spellcheck="false" autocomplete="off">`}</label>`).join('');
}
function openLab(id) {
    const lab=labs[id], config=lab.config, info=demoInfo.find(d=>d.id===id);
    const values=demoInputs.get(id)||config.default;
    currentLab={id,result:lab.run(values),step:0};
    byId('main').innerHTML=`<div class="title-row"><div><div class="eyebrow">第 06 章 · 算法可视化</div><h1>${info.title}</h1><p>${info.desc}</p></div><a class="secondary" href="#${topics[info.topic].id}">${icon('book')}查看相关知识</a></div>
        <nav class="lab-tabs" aria-label="算法选择">${demoInfo.map(d=>`<a href="${demoHref(d.id)}" class="chip"${d.id===id?' aria-current="true"':''}>${d.title}</a>`).join('')}</nav>
        <div class="lab-grid">
          <section class="panel stage" aria-labelledby="stage-title">
            <div class="stage-head"><h2 id="stage-title">${config.stage}</h2><span class="mono" id="step-count"></span></div>
            <div class="stage-view" id="stage-view"></div>
            ${id==='traversal'?'<div class="stage-legend"><span><i></i>当前调用或已访问</span><span><i class="solid"></i>本步输出</span></div>':''}
            <div class="line-state"><div class="output-label" id="output-label"></div><div id="lab-output" class="status-chips" aria-labelledby="output-label"></div></div>
            <div class="step-strip"><p id="step-text" role="status"></p><div class="timeline" role="progressbar" aria-label="实验进度" aria-valuemin="0" id="timeline"><i></i></div>
              <div class="controls">
                <button class="primary" data-action="play" id="play-btn"></button>
                <button class="secondary" data-action="step-back" id="back-btn">上一步</button>
                <button class="secondary" data-action="step-next" id="next-btn">下一步</button>
                <button class="secondary" data-action="reset">${icon('reset')}重置</button>
                <select id="speed" aria-label="播放速度">${[0.5,1,1.5,2].map(n=>`<option value="${n}"${selected(n,speed)}>${n}×</option>`).join('')}</select>
              </div></div>
          </section>
          <div><section class="panel inspector"><div class="lab-inspect-head"><h2>伪代码与状态</h2></div><ol class="pseudo" id="algorithm-code"></ol>
            <div class="inspector-body"><h3 id="state-title"></h3><div id="state-items" class="status-chips"></div><p id="state-extra"></p></div></section>
          <section class="panel form-panel"><h2>${config.title}</h2><form id="lab-form" novalidate>
            ${renderFields(config,values)}<p class="form-help">${config.help}</p><p id="lab-error" class="form-error" role="alert" hidden></p>
            <div class="form-actions"><button class="primary" type="submit">应用输入</button>${(config.presets||[['载入示例',{}]]).map(([label],i)=>`<button class="secondary" type="button" data-action="preset" data-index="${i}">${label}</button>`).join('')}</div>
          </form></section></div>
        </div>`;
    updateFrame();
}
function tokens(items,fallback) {
    return items.length?items.map(x=>`<span class="token mono">${esc(x)}</span>`).join(''):`<span class="token">${fallback}</span>`;
}
function arrayMarkup(values,active) {
    return `<div class="array-view" aria-label="当前数组">${values.map((value,i)=>`<span class="mono ${active.includes(i)?'hot':''}">${esc(value)}<small>${i}</small></span>`).join('')}</div>`;
}
function updateFrame() {
    if (!currentLab) return;
    const {result,step}=currentLab;
    const frame=result.frames[step];
    const total=result.frames.length-1;
    byId('stage-view').innerHTML=frame.forestGraph?
        `<div class="paired-plots"><div><h3>原森林</h3>${drawTree(frame.graph,frame.primary,350)}</div><div><h3>二叉表示</h3>${drawTree(frame.forestGraph,frame.secondary,350)}</div></div>`:
        `${drawTree(frame.graph,frame,currentLab.id==='huffman'?650:550)}${frame.array?arrayMarkup(frame.array,frame.active):''}`;
    byId('step-count').textContent=`步骤 ${step} / ${total}`;
    byId('step-text').textContent=frame.explanation;
    const timeline=byId('timeline');
    timeline.setAttribute('aria-valuenow',String(step));
    timeline.setAttribute('aria-valuemax',String(total));
    timeline.firstElementChild.style.width=`${total?step/total*100:0}%`;
    byId('output-label').textContent=result.outputLabel;
    byId('lab-output').innerHTML=tokens(frame.output,'空');
    byId('state-title').textContent=frame.detailTitle;
    byId('state-items').innerHTML=tokens(frame.items,'空');
    byId('state-extra').textContent=frame.detail||'';
    byId('algorithm-code').innerHTML=result.code.map((line,i)=>`<li${i===frame.line?' class="hot" aria-current="step"':''}><span>${i+1}</span>${esc(line)}</li>`).join('');
    byId('back-btn').disabled=step===0;
    byId('next-btn').disabled=step===total;
    updatePlayButton();
}
function updatePlayButton() {
    const btn=byId('play-btn');
    if (!btn||!currentLab) return;
    const atEnd=currentLab.step===currentLab.result.frames.length-1;
    btn.innerHTML=timer?`${icon('pause')}暂停`:`${icon(atEnd?'reset':'play')}${atEnd?'重播':'播放'}`;
}
function pause() {
    if (timer!==null) { clearInterval(timer); timer=null; }
    updatePlayButton();
}
function moveStep(delta) {
    if(!currentLab) return;
    const last=currentLab.result.frames.length-1;
    currentLab.step=Math.min(last,Math.max(0,currentLab.step+delta));
    if(currentLab.step===last) pause();
    updateFrame();
}
function play() {
    if(!currentLab) return;
    if(timer!==null) { pause(); return; }
    if(currentLab.step===currentLab.result.frames.length-1) currentLab.step=0;
    timer=setInterval(()=>moveStep(1),690/speed);
    updateFrame();
}
function applyLab(values) {
    if(!currentLab) return;
    pause();
    const {id}=currentLab;
    const error=byId('lab-error');
    try {
        const result=labs[id].run(values);
        demoInputs.set(id,values);
        currentLab={id,result,step:0};
        error.hidden=true;
        updateFrame();
    } catch (exception) {
        error.textContent=exception.message;
        error.hidden=false;
    }
}
function fillPreset(index) {
    const {id}=currentLab;
    const {config}=labs[id];
    const values={...config.default,...(config.presets?.[index]?.[1]||{})};
    const form=byId('lab-form');
    config.fields.forEach(([key])=>form.elements.namedItem(key).value=values[key]);
    applyLab(values);
}

document.addEventListener('click',event=>{
    const control=event.target.closest('[data-action]');
    if(control) {
        const action=control.dataset.action;
        if(action==='menu') setSidebar(!sidebarOpen);
        if(action==='theme') updateTheme();
        if(action==='search') openSearch();
        if(action==='close-search') byId('search-dialog').close();
        if(action==='learn'&&route.kind==='topic') toggleLearn(route.id);
        if(action==='play') play();
        if(action==='step-back') { pause(); moveStep(-1); }
        if(action==='step-next') { pause(); moveStep(1); }
        if(action==='reset'&&currentLab) { pause(); currentLab.step=0; updateFrame(); }
        if(action==='preset'&&currentLab) fillPreset(Number(control.dataset.index));
        return;
    }
    const anchor=event.target.closest('a');
    if(anchor?.closest('#search-results')) byId('search-dialog').close();
    if(anchor?.closest('#sidebar')) setSidebar(false);
    if(anchor?.classList.contains('skip')) {
        event.preventDefault();
        byId('main').focus();
    }
});
byId('search-input').addEventListener('input',fillSearch);
byId('search-input').addEventListener('keydown',event=>{
    if(event.key!=='Enter') return;
    const first=byId('search-results').querySelector('a');
    if(first) first.click();
});
document.addEventListener('keydown',event=>{
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k') {
        event.preventDefault();
        openSearch();
    }
    if(event.key==='Escape'&&sidebarOpen) setSidebar(false);
});
document.addEventListener('change',event=>{
    if(event.target.id==='speed') {
        speed=Number(event.target.value);
        if(timer!==null){ pause(); play(); }
    }
});
document.addEventListener('submit',event=>{
    if(event.target.id!=='lab-form') return;
    event.preventDefault();
    applyLab(Object.fromEntries(new FormData(event.target)));
});
window.addEventListener('hashchange',()=>{
    renderRoute();
    byId('main').focus({preventScroll:true});
});
renderRoute({scroll:false});
</script>
</body>
</html>
